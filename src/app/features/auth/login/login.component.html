<main class="login-page">
  <div class="login-card">
    <h1>LILY POENTE</h1>
    <p class="subtitle">Acesso Administrativo</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">USUÁRIO</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="username" 
          required 
          placeholder="admin@lilypoente.com">
      </div>

      <div class="form-group">
        <label for="password">SENHA</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="••••••••">
      </div>

      <p class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'ENTRANDO...' : 'ENTRAR NO PAINEL' }}
      </button>
    </form>

    <a routerLink="/" class="back-link">&larr; Voltar para o site</a>
  </div>
</main>
