<section id="portfolio" class="gallery-section">
  
  <div class="gallery-header">
    <h2>NOSSO PORTFÓLIO</h2>
  </div>

  <div class="gallery-wrapper">
    <!-- Item da Galeria com evento de Clique -->
    <div class="portfolio-item" 
         *ngFor="let item of portfolioItems$ | async" 
         (click)="openLightbox(item.imageUrl)">
      
      <div class="image-wrapper">
        <img [src]="item.imageUrl" [alt]="item.title">
        
        <div class="overlay">
          <span class="category">{{ item.category }}</span>
          <h3>{{ item.title }}</h3>
        </div>
      </div>
      
    </div>
  </div>

</section>

<!-- LIGHTBOX / MODAL DE IMAGEM -->
<div class="lightbox" *ngIf="selectedImage" (click)="closeLightbox()">
  
  <span class="close-btn" (click)="closeLightbox()">&times;</span>
  
  <img [src]="selectedImage" alt="Imagem ampliada" (click)="$event.stopPropagation()">
  
</div>
