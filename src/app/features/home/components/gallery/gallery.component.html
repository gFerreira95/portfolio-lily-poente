<section id="portfolio" class="gallery-section">
  <div class="gallery-header">
    <h2>NOSSO PORTFÓLIO</h2>
  </div>

  <div class="gallery-wrapper">
    <!-- Usamos let i = index para saber qual imagem foi clicada -->
    <div class="portfolio-item" 
         *ngFor="let item of portfolioItems; let i = index" 
         (click)="openLightbox(i)">
      
      <div class="image-wrapper">
        <img [src]="item.imageUrl" [alt]="item.title" (contextmenu)="$event.preventDefault()">
        <div class="overlay">
          <span class="category">{{ item.category }}</span>
          <h3>{{ item.title }}</h3>
        </div>
      </div>
      
    </div>
  </div>
</section>

<!-- LIGHTBOX / MODAL DE IMAGEM COM NAVEGAÇÃO -->
<div class="lightbox" 
     *ngIf="currentIndex !== null" 
     (click)="closeLightbox()"
     (touchstart)="onTouchStart($event)"
     (touchend)="onTouchEnd($event)">
    
  <span class="close-btn" (click)="closeLightbox()">&times;</span>
  
  <!-- Botão Voltar (Seta Esquerda) -->
  <button class="nav-btn prev-btn" (click)="prevImage($event)"><svg width="11px" height="20px"  viewBox="0 0 11 20" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Generator: Sketch 52.5 (67469) - http://www.bohemiancoding.com/sketch -->
    <title>arrow_back_ios</title>
    <desc>Created with Sketch.</desc>
    <g id="Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="Rounded" transform="translate(-548.000000, -3434.000000)">
            <g id="Navigation" transform="translate(100.000000, 3378.000000)">
                <g id="-Round-/-Navigation-/-arrow_back_ios" transform="translate(442.000000, 54.000000)">
                    <g>
                        <polygon id="Path" opacity="0.87" points="0 0 24 0 24 24 0 24"></polygon>
                        <path d="M16.62,2.99 C16.13,2.5 15.34,2.5 14.85,2.99 L6.54,11.3 C6.15,11.69 6.15,12.32 6.54,12.71 L14.85,21.02 C15.34,21.51 16.13,21.51 16.62,21.02 C17.11,20.53 17.11,19.74 16.62,19.25 L9.38,12 L16.63,4.75 C17.11,4.27 17.11,3.47 16.62,2.99 Z" id="🔹-Icon-Color" fill="#1D1D1D"></path>
                    </g>
                </g>
            </g>
        </g>
    </g>
</svg></button>
  
  <!-- Conteúdo Central -->
  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <!-- Usamos portfolioItems[currentIndex] para puxar a imagem certa -->
    <img [src]="portfolioItems[currentIndex].imageUrl" alt="Imagem ampliada" (contextmenu)="$event.preventDefault()">
    
    <div class="lightbox-info">
      <span class="category">{{ portfolioItems[currentIndex].category }}</span>
      <h3>{{ portfolioItems[currentIndex].title }}</h3>
    </div>
  </div>

  <!-- Botão Avançar (Seta Direita) -->
  <button class="nav-btn next-btn" (click)="nextImage($event)"><svg width="11px" height="20px" viewBox="0 0 11 20" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Generator: Sketch 52.5 (67469) - http://www.bohemiancoding.com/sketch -->
    <title>arrow_forward_ios</title>
    <desc>Created with Sketch.</desc>
    <g id="Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="Rounded" transform="translate(-345.000000, -3434.000000)">
            <g id="Navigation" transform="translate(100.000000, 3378.000000)">
                <g id="-Round-/-Navigation-/-arrow_forward_ios" transform="translate(238.000000, 54.000000)">
                    <g>
                        <polygon id="Path" opacity="0.87" points="24 24 0 24 0 0 24 0"></polygon>
                        <path d="M7.38,21.01 C7.87,21.5 8.66,21.5 9.15,21.01 L17.46,12.7 C17.85,12.31 17.85,11.68 17.46,11.29 L9.15,2.98 C8.66,2.49 7.87,2.49 7.38,2.98 C6.89,3.47 6.89,4.26 7.38,4.75 L14.62,12 L7.37,19.25 C6.89,19.73 6.89,20.53 7.38,21.01 Z" id="🔹-Icon-Color" fill="#1D1D1D"></path>
                    </g>
                </g>
            </g>
        </g>
    </g>
</svg></button>
  
</div>
